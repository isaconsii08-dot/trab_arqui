name: CI – Lint, Type Check & Test

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Code quality checks (runs in parallel across all packages)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@biblioflow/shared-*

      - name: Generate Prisma clients
        run: pnpm turbo run db:generate

      - name: Type check all packages
        run: pnpm turbo run type-check

      - name: Lint all packages
        run: pnpm turbo run lint

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@biblioflow/shared-*

      - name: Generate Prisma clients
        run: pnpm turbo run db:generate

      - name: Run unit tests
        run: pnpm turbo run test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Integration tests (Circulation Service – Saga pattern)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests-circulation:
    name: Integration Tests – Circulation Service
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: circulation_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ['5435:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@biblioflow/shared-*

      - name: Run database migrations
        working-directory: services/circulation-service
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5435/circulation_test
        run: pnpm db:generate

      - name: Run integration tests
        working-directory: services/circulation-service
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5435/circulation_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_secret_key_for_ci
        run: pnpm test

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Docker build validation (multi-stage)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [unit-tests]

    strategy:
      matrix:
        service:
          - patron-service
          - catalog-service
          - circulation-service
          - holdings-service
          - api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/biblioflow/${{ matrix.service }}:ci-${{ github.sha }}
